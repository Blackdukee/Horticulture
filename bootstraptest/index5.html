<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        
    <link rel="stylesheet" href="style2.scss">
    
    <title>Document</title>
</head>
<body>

        <!-- Button trigger modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
  Launch demo modal
</button>


        
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" id="dialog"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div style="height: 300px; overflow-y:auto;">
                            <ul class="list-group">
                                        <div class="card mb-3">
                                            <div class="card-body d-flex align-items-center">
                                                <div class="col-md-4" style="width:100px">
                                                    <img src="imgs2/Lavender.jpg" class="img-fluid rounded-start" alt="image" style="height:118px;">
                                                </div>
                                                <div class="card-desc">
                                                    <h5 class="card-title">Product Name</h5>
                                                    <p class="card-text">Product description</p>
                                                </div>
                                                <div class="input-group mr-3">
                                                    <div class="input-group-prepend">
                                                        <button class="btn btn-outline-secondary" id="minusbtn" type="button">-</button>
                                                    </div>
                                                    <input type="number" id="inputnumber" class="form-control" value="1" min="1" max="100">
                                                    <div class="input-group-append">
                                                        <button class="btn btn-outline-secondary" id="addbtn"  type="button">+</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                            </ul>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary">Save changes</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
    
    <script>
    
    
    function addOrMinusItemQuantity() {
        let add = document.getElementById("addbtn");
        let minus = document.getElementById("minusbtn");
        let input = document.getElementById("inputnumber");
        
        add.addEventListener("click", function(){
            if(input.value >= 100){
                input.value = 100;
            }
            input.value = parseInt(input.value) + 1;
        });
        minus.addEventListener("click", function(){
            if(input.value <= 1){
                input.value = 1;
            }else{
                            input.value = parseInt(input.value) - 1;

            }
        });
    }
    addOrMinusItemQuantity();
    </script>

</body>
</html>
