<html lang="en">
<head>
    <meta charset="UTF-8">

        crossorigin="anonymous" referrerpolicy="no-referrer" />
        
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
    
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
        <div class="container">
            <div class="gridsys">
                
            </div>
        </div>
       
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script type="text/javascript">
                     
            
        
            function fetch_data(page){
                let container = document.querySelector('.container');
                $.ajax({
                    url:"pagination.php",
                    method:"POST",
                    data:{page:page},
                    success:function(data){
                        let two = new DOMParser().parseFromString(data, "text/html");
                        
                        let fav  = two.querySelectorAll('.col');
                        let oldelement = two.querySelectorAll('.fa-heart');
                        console.log(oldelement);
                        
                     
                     
                        $('.gridsys').html(two.querySelectorAll('.col'));
                        if(container.hasChildNodes(two.querySelector('.pagination'))){
                            container.removeChild(container.lastChild);
                            container.appendChild(two.querySelector('.pagination'));
                        }
                    }
                });
            };
                fetch_data();
                
                $(document).on('click','.page-item',function(){
                    var page = $(this).attr("id");
                    fetch_data(page);
                });
                
                $(document).on('click','.fa-heart',function(){
                        let id = $(this).attr("id");
                        fav = $(this);
                        console.log(fav);
                        console.log(fav[0]);
                        fav[0].addEventListener("click", function () {
                            handleclick();
                            console.log("clicked");
                        });
                });
    
                
                function pressed() {
                    if (document.querySelector(".fa-sharp").classList.contains("fa-regular")) {
                        document.querySelector(".fa-sharp").classList.toggle("fa-bounce");
                        // make it move for 1 second
                        setTimeout(function () {
                            document.querySelector(".fa-sharp").classList.toggle("fa-bounce");
                        }, 1000);
                        document.querySelector(".fa-sharp").classList.remove("fa-regular");
                        document.querySelector(".fa-sharp").classList.add("fa-solid");
                    } else {
                        document.querySelector(".fa-sharp").classList.toggle("fa-bounce");
                        setTimeout(function () {
                            document.querySelector(".fa-sharp").classList.toggle("fa-bounce");
                        }, 1000);
                        document.querySelector(".fa-sharp").classList.remove("fa-solid");
                        document.querySelector(".fa-sharp").classList.add("fa-regular");
                    }


                }
       
                function handleclick() {
                    setTimeout(pressed(), 2000);
                }
        </script>
</body>
</html>
